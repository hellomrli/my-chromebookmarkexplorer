name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy test runtime
        shell: pwsh
        run: |
          windeployqt --release --no-translations build\Release\BookmarkExplorerTests.exe
          exit $LASTEXITCODE

      - name: Core bookmark tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --verbose --no-tests=error -R '^(Bookmark(Document|Explorer)|FaviconLoader)Tests$' --output-junit core-tests.xml
          exit $LASTEXITCODE

      - name: Health checker tests
        id: health-tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --verbose --no-tests=error -R '^HealthCheckerTests$' --output-junit health-tests.xml
          exit $LASTEXITCODE

      - name: Test summary
        if: always()
        shell: pwsh
        env:
          HEALTH_TEST_OUTCOME: ${{ steps.health-tests.outcome }}
        run: |
          "Health checker tests: $env:HEALTH_TEST_OUTCOME (currently non-blocking). Core bookmark tests must pass before packaging." >> $env:GITHUB_STEP_SUMMARY
          if ($env:HEALTH_TEST_OUTCOME -eq 'failure') {
            Write-Warning "Health checker tests failed. See test-results; this build is not fully validated."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            build/*-tests.xml
            build/*Tests.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ChromeBookmarkExplorer | Out-Null
          Copy-Item build\Release\ChromeBookmarkExplorer.exe dist\ChromeBookmarkExplorer\ -Force
          windeployqt --release --no-translations dist\ChromeBookmarkExplorer\ChromeBookmarkExplorer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsInstall) { throw "Visual Studio C++ installation not found" }
          $crt = Get-ChildItem "$vsInstall\VC\Redist\MSVC" -Directory -Recurse -Filter 'Microsoft.VC*.CRT' |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "MSVC x64 runtime directory not found" }
          Copy-Item "$($crt.FullName)\*.dll" dist\ChromeBookmarkExplorer\ -Force
          foreach ($file in @('ChromeBookmarkExplorer.exe', 'Qt6Core.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'platforms\qwindows.dll', 'msvcp140.dll', 'vcruntime140.dll')) {
            if (!(Test-Path "dist\ChromeBookmarkExplorer\$file")) { throw "Missing runtime file: $file" }
          }

      - name: Packaged app startup smoke test
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD\dist\ChromeBookmarkExplorer\ChromeBookmarkExplorer.exe" -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "Packaged app exited unexpectedly: $($app.ExitCode)" }
            "Packaged Windows app remained running for 5 seconds." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist\ChromeBookmarkExplorer\* -DestinationPath ChromeBookmarkExplorer-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromeBookmarkExplorer-windows-x64
          path: ChromeBookmarkExplorer-windows-x64.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $projectLine = Select-String -Path CMakeLists.txt -Pattern 'project\(ChromeBookmarkExplorer VERSION ([^ ]+)'
          $version = $projectLine.Matches[0].Groups[1].Value
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "v$version"
          $title = "Chrome Bookmark Explorer v$version"
          $notes = @"
          Automated Windows x64 build.

          Commit: $shortSha
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes --target $env:GITHUB_SHA
            gh release upload $tag ChromeBookmarkExplorer-windows-x64.zip --clobber
          } else {
            gh release create $tag ChromeBookmarkExplorer-windows-x64.zip --title $title --notes $notes --target $env:GITHUB_SHA --latest
          }
